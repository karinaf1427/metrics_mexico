[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metrics_mexico"
version = "0.1.0"
description = "A curated collection of Mexico-related datasets for data analysis, economic research, and education. Includes population statistics, salary levels, international rankings, government budgets, trade data, stock market data, airport traffic, earthquakes, and environmental indicators from Kaggle sources."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Karina Fernanda Pérez Domínguez", email = "karinaf1427@gmail.com" }
]
maintainers = [
    { name = "Karina Fernanda Pérez Domínguez", email = "karinaf1427@gmail.com" }
]
requires-python = ">=3.8"
keywords = [
    "datasets",
    "mexico",
    "mexican data",
    "population",
    "demographics",
    "salaries",
    "minimum wage",
    "economics",
    "government budget",
    "trade",
    "tariffs",
    "stock market",
    "financial data",
    "international rankings",
    "airports",
    "earthquakes",
    "environmental data",
    "data analysis",
    "data science",
    "research",
    "education",
    "kaggle"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Natural Language :: English"
]
dependencies = [
    "pandas>=1.5"
]